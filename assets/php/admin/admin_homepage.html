<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Blog</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<style>
    :root {
    --primary-color: #1e1e2d;
    --secondary-color: #27293d;
    --accent-color: #ff9800;
    --text-light: #ffffff;
    --text-dark: #333;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f4f4;
    color: var(--text-dark);
    min-height: 100vh;
}

/* Topbar */
.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: var(--primary-color);
    color: var(--text-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 1000;
}

.menu-toggle {
    font-size: 20px;
    background: none;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    margin-right: 20px;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 240px;
    height: calc(100% - 60px);
    background: var(--secondary-color);
    color: var(--text-light);
    padding: 20px 0;
    overflow-y: auto;
    transition: transform 0.3s ease;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 20px;
}

.sidebar ul {
    list-style: none;
}

.sidebar ul li {
    padding: 12px 20px;
}

.sidebar ul li a {
    color: var(--text-light);
    text-decoration: none;
    display: block;
}

.sidebar ul li:hover {
    background: var(--accent-color);
    color: white;
    border-radius: 5px;
}

/* Main Content */
.content {
    margin-top: 60px;
    margin-left: 240px;
    padding: 20px;
    flex: 1;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 10px;
    color: var(--accent-color);
}

/* Mobile Styles */
@media screen and (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
        position: fixed;
    }

    .sidebar.active {
        transform: translateX(0);
    }

    .content {
        margin-left: 0;
    }
}

</style>
<body>
<header class="topbar">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <h1>Blog Admin</h1>
</header>

<aside class="sidebar" id="sidebar">
    <h2>Menu</h2>
    <ul>
        <li><a href="index.php">Dashboard</a></li>
        <li><a href="posts.php">Posts</a></li>
        <li><a href="add_post.php">Add New Post</a></li>
        <li><a href="categories.php">Categories</a></li>
        <li><a href="comments.php">Comments</a></li>
        <li><a href="users.php">Users</a></li>
        <li><a href="add_user.php">Add New User</a></li>
        <li><a href="media.php">Media Library</a></li>
        <li><a href="settings.php">Settings</a></li>
        <li><a href="profile.php">Profile</a></li>
        <li><a href="../index.php">View Site</a></li>
        <li><a href="logout.php">Logout</a></li>
    </ul>
</aside>

<main class="content">
    <h2>Dashboard</h2>
    <div class="stats">
        <div class="card">
            <h3>Total Posts</h3>
            <p>120</p>
        </div>
        <div class="card">
            <h3>Comments</h3>
            <p>350</p>
        </div>
        <div class="card">
            <h3>Users</h3>
            <p>15</p>
        </div>
        <div class="card">
            <h3>Categories</h3>
            <p>8</p>
        </div>
    </div>
</main>
</body>
<script>document.getElementById("menuToggle").addEventListener("click", function() {
    document.getElementById("sidebar").classList.toggle("active");
});
</script>
</html>
